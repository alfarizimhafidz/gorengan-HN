<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <!-- Header QRIS -->
  <rect width="400" height="90" fill="#ffffff" />
  
  <!-- Red banner QRIS National -->
  <path d="M 40 25 L 360 25" stroke="#C92A2A" stroke-width="4" stroke-linecap="round"/>
  
  <!-- QRIS Text Logo -->
  <g transform="translate(130, 35)">
    <text x="0" y="32" font-size="34" font-weight="900" fill="#1e293b" letter-spacing="-1">QRIS</text>
    <text x="95" y="24" font-size="11" font-weight="700" fill="#C92A2A">NASIONAL</text>
    <text x="95" y="36" font-size="9" font-weight="500" fill="#64748b">PEMBAYARAN DIGITAL</text>
  </g>
  
  <!-- Merchant Card -->
