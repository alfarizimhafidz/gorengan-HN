    <rect x="200" y="210" width="15" height="15"/>
    <rect x="230" y="210" width="20" height="15"/>
    <rect x="145" y="240" width="30" height="15"/>
    <rect x="200" y="240" width="15" height="30"/>
    <rect x="235" y="240" width="15" height="15"/>
    <rect x="145" y="270" width="15" height="30"/>
    <rect x="180" y="270" width="35" height="15"/>
    <rect x="235" y="270" width="15" height="30"/>
    <rect x="270" y="285" width="30" height="15"/>
    <rect x="315" y="285" width="20" height="15"/>
    <rect x="65" y="285" width="15" height="30"/>
    <rect x="95" y="285" width="30" height="15"/>
    <rect x="145" y="315" width="15" height="50"/>
    <rect x="240" y="315" width="15" height="50"/>
    <rect x="270" y="315" width="45" height="15"/>
