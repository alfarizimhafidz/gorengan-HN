  <text x="200" y="122" font-size="18" font-weight="800" fill="#231a10" text-anchor="middle">GORENGAN HN</text>
  <text x="200" y="142" font-size="11" font-weight="600" fill="#7A6451" text-anchor="middle">NMID : ID1024395820491 • A01</text>
  
  <!-- QR Code Frame -->
  <rect x="40" y="180" width="320" height="320" rx="16" fill="#ffffff" stroke="#231a10" stroke-width="3"/>
  
  <!-- QR Code Inner Pattern Simulation -->
  <!-- Top Left Target -->
